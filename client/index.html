<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BJPoker — Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="min-h-screen bg-slate-900 text-slate-100">
    <header class="border-b border-slate-800 px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold tracking-wide">BJPoker</h1>
      <div id="user-bar" class="text-sm text-slate-400 flex items-center gap-4"></div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-10">
      <!-- Auth view -->
      <section id="auth-view" class="hidden max-w-sm mx-auto bg-slate-800 rounded-xl p-6 shadow-lg">
        <div class="flex gap-2 mb-6">
          <button id="tab-login" class="flex-1 py-2 rounded bg-emerald-600 text-white font-medium">Log in</button>
          <button id="tab-register" class="flex-1 py-2 rounded bg-slate-700 text-slate-200 font-medium">Register</button>
        </div>
        <form id="auth-form" class="space-y-4">
          <div>
            <label class="block text-sm text-slate-400 mb-1" for="username">Username</label>
            <input id="username" name="username" type="text" required minlength="3" maxlength="20"
                   pattern="[a-zA-Z0-9_]+"
                   class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 focus:border-emerald-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-sm text-slate-400 mb-1" for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6"
                   class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 focus:border-emerald-500 focus:outline-none" />
          </div>
          <p id="auth-error" class="text-sm text-red-400 hidden"></p>
          <button type="submit" id="auth-submit"
                  class="w-full py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-medium transition">
            Log in
          </button>
        </form>
      </section>

      <!-- Lobby view -->
      <section id="lobby-view" class="hidden">
        <!-- Game picker -->
        <div id="game-picker" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-12">
          <button data-game="blackjack"
                  class="game-btn group bg-emerald-700 hover:bg-emerald-600 transition rounded-2xl py-16 px-8 text-center shadow-xl">
            <div class="text-5xl font-bold tracking-wide mb-2">Blackjack</div>
            <div class="text-emerald-200 group-hover:text-white">5 tables · up to 6 players each</div>
          </button>
          <button data-game="poker"
                  class="game-btn group bg-amber-700 hover:bg-amber-600 transition rounded-2xl py-16 px-8 text-center shadow-xl">
            <div class="text-5xl font-bold tracking-wide mb-2">Texas Hold'em</div>
            <div class="text-amber-200 group-hover:text-white">5 tables · 2–6 players each</div>
          </button>
        </div>

        <!-- Table list (hidden until a game is picked) -->
        <div id="table-section" class="hidden">
          <div class="flex items-center justify-between mb-6">
            <h2 id="table-section-title" class="text-2xl font-semibold"></h2>
            <button id="back-btn"
                    class="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-white text-sm">
              ← Back
            </button>
          </div>
          <div id="table-list" class="space-y-2"></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/js/auth.js" type="module"></script>
    <script src="/js/lobby.js" type="module"></script>
  </body>
</html>
